<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>UNIROLIST-LABS - Enregistrement</title>
    <link rel="stylesheet" href="/modern-style.css">
</head>
<body>
    <header>
        <div class="logo">UNIROLIST-LABS</div>
        <nav>
            <ul>
                <li><a href="/">Accueil</a></li>
                <li><a href="/register" class="active">Enregistrement</a></li>
                <li><a href="/sheets">Fiches</a></li>
                <li><a href="/login-player">Connexion Joueur</a></li>
                <li><a href="/admin">Admin</a></li>
            </ul>
        </nav>
    </header>

    <main class="container">
        <form id="register-form" action="/register" method="POST">
            <h2>Création de votre Fiche Personnage</h2>

            <label for="pseudo">Pseudo :</label>
            <input type="text" id="pseudo" name="pseudo" required>

            <label for="tel">Numéro de téléphone :</label>
            <input type="text" id="tel" name="tel" required placeholder="Utilisé pour votre connexion joueur">

            <label for="faction">Faction :</label>
            <select id="faction" name="faction" required>
                <option value="Hermès">Hermès</option>
                <option value="Hécates">Hécates</option>
                <option value="Arès">Arès</option>
                <option value="Atlas">Atlas</option>
            </select>

            <h3>Statistiques (Total doit être 150)</h3>
            <label for="force">Force :</label>
            <input type="number" id="force" name="force" required>

            <label for="esprit">Esprit :</label>
            <input type="number" id="esprit" name="esprit" required>

            <label for="pouvoir">Pouvoir :</label>
            <input type="number" id="pouvoir" name="pouvoir" required>

            <p id="stats-total" style="text-align: center; margin-bottom: 1.5rem; font-family: var(--font-primary);">Total des stats : 0 / 150</p>

            <button type="submit" class="btn">Soumettre pour Validation</button>
        </form>
    </main>

    <footer>
        <p>&copy; 2025 UNIROLIST-LABS - Tous droits réservés</p>
    </footer>

    <script src="/register.js"></script>
</body>
</html>
