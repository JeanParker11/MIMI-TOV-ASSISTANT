<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>UNIROLIST-LABS - Modifier la fiche</title>
    <link rel="stylesheet" href="/style.css">
</head>
<body>
    <header>
        <h1>UNIROLIST-LABS</h1>
        <nav>
            <ul>
                <li><a href="/">Accueil</a></li>
                <li><a href="/register">Enregistrement</a></li>
                <li><a href="/sheets">Fiches</a></li>
                <li><a href="/admin">Admin</a></li>
            </ul>
        </nav>
    </header>
    <main>
        <h2>Modifier la fiche</h2>
        <form id="edit-form" method="POST">
            <label for="pseudo">Pseudo :</label>
            <input type="text" id="pseudo" name="pseudo" required>

            <label for="tel">Numéro de téléphone :</label>
            <input type="text" id="tel" name="tel" required>

            <label for="faction">Faction :</label>
            <select id="faction" name="faction" required>
                <option value="Hermès">Hermès</option>
                <option value="Hécates">Hécates</option>
                <option value="Arès">Arès</option>
                <option value="Atlas">Atlas</option>
            </select>

            <label for="force">Force :</label>
            <input type="number" id="force" name="force" required>

            <label for="esprit">Esprit :</label>
            <input type="number" id="esprit" name="esprit" required>

            <label for="pouvoir">Pouvoir :</label>
            <input type="number" id="pouvoir" name="pouvoir" required>

            <p id="stats-total">Total des stats : 0 / 150</p>

            <button type="submit">Enregistrer les modifications</button>
        </form>
    </main>
    <footer>
        <p>&copy; 2025 UNIROLIST-LABS</p>
    </footer>

    <script src="/edit.js"></script>
</body>
</html>
